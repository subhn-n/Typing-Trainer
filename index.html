<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Trainer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d9e0ea;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --danger: #b42318;
      --good: #15803d;
      --shadow: 0 18px 50px rgba(20, 31, 49, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 34rem),
        linear-gradient(135deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--text);
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0;
    }

    .app-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .last-score {
      min-width: 190px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      padding: 12px 14px;
      text-align: right;
    }

    .last-score span,
    .stat span,
    label {
      color: var(--muted);
      display: block;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .last-score strong {
      display: block;
      margin-top: 4px;
      font-size: 1.35rem;
    }

    .trainer {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: clamp(18px, 4vw, 30px);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfcfe;
      padding: 14px;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: clamp(1.35rem, 4vw, 2rem);
      line-height: 1;
    }

    .mode-panel {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) minmax(120px, 1fr) auto auto auto;
      gap: 12px;
      align-items: end;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfcfe;
      padding: 14px;
      margin-bottom: 18px;
    }

    .field { min-width: 0; }
    .field label { margin: 0 0 8px; }

    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      color: var(--text);
      font: inherit;
      padding: 0 12px;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }

    .target {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #f8fafc;
      padding: clamp(16px, 4vw, 24px);
      min-height: 142px;
      font-size: clamp(1.18rem, 3vw, 1.55rem);
      line-height: 1.75;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .pace-cursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 2px;
      height: 1.75em;
      border-radius: 99px;
      background: rgba(52, 64, 84, 0.16);
      opacity: 0.72;
      pointer-events: none;
      transform: translate(0, 0);
    }

    .char {
      position: relative;
      z-index: 1;
      border-radius: 4px;
      padding: 1px 0;
      transition: background-color 120ms ease, color 120ms ease;
    }

    .char.correct {
      color: var(--good);
      background: rgba(21, 128, 61, 0.1);
    }

    .char.incorrect {
      color: var(--danger);
      background: rgba(180, 35, 24, 0.12);
    }

    .char.current {
      background: rgba(15, 118, 110, 0.18);
      outline: 1px solid rgba(15, 118, 110, 0.45);
    }

    label {
      margin: 20px 0 8px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      color: var(--text);
      background: #ffffff;
      font: inherit;
      font-size: 1.08rem;
      line-height: 1.6;
      outline: none;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 16px;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .restart-control {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .restart-hint {
      color: var(--muted);
      font-size: 0.78rem;
      opacity: 0.72;
    }

    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      padding: 12px 18px;
      min-height: 46px;
      transition: background-color 140ms ease, transform 140ms ease;
    }

    button:hover {
      background: var(--accent-strong);
      transform: translateY(-1px);
    }

    button:active { transform: translateY(0); }

    .complete {
      color: var(--good);
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .stats,
      .mode-panel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      main {
        width: min(100% - 20px, 1080px);
        padding: 18px 0;
      }

      .app-header,
      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      .last-score { text-align: left; }
      button { width: 100%; }
    }

    @media (max-width: 420px) {
      .stats,
      .mode-panel {
        grid-template-columns: 1fr;
      }

      .target { min-height: 120px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="app-header">
      <div>
        <h1>Typing Trainer</h1>
        <p class="subtitle">Random phrases, custom letter drills, and local score tracking.</p>
      </div>
      <div class="last-score" aria-live="polite">
        <span>Last Score</span>
        <strong id="lastScore">0 WPM</strong>
      </div>
    </header>

    <section class="trainer" aria-label="Typing trainer">
      <div class="stats" aria-live="polite">
        <div class="stat"><span>WPM</span><strong id="wpm">0</strong></div>
        <div class="stat"><span>Accuracy</span><strong id="accuracy">100%</strong></div>
        <div class="stat"><span>Time</span><strong id="timer">0s</strong></div>
        <div class="stat"><span>Progress</span><strong id="progress">0%</strong></div>
        <div class="stat"><span>Letter</span><strong id="letterStat">-</strong></div>
      </div>

      <div class="mode-panel" aria-label="Practice controls">
        <div class="field">
          <label for="letterSelect">Custom Mode</label>
          <select id="letterSelect" aria-label="Practice letter"></select>
        </div>
        <div class="field">
          <label for="targetWpmSelect">Target WPM</label>
          <select id="targetWpmSelect" aria-label="Target WPM">
            <option value="20">20 WPM</option>
            <option value="40" selected>40 WPM</option>
            <option value="60">60 WPM</option>
            <option value="80">80 WPM</option>
            <option value="100">100 WPM</option>
            <option value="120">120 WPM</option>
          </select>
        </div>
        <button id="changeLetterButton" type="button">Change Letter</button>
        <button id="nextLetterButton" type="button">Next Letter</button>
        <button id="exitCustomButton" type="button">Exit Custom Mode</button>
      </div>

      <div id="targetText" class="target" aria-label="Text to copy"></div>

      <label for="typingInput">Typing Area</label>
      <textarea
        id="typingInput"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Start typing here to begin the timer..."
      ></textarea>

      <div class="actions">
        <div id="status" class="status">Ready. Copy the text shown above.</div>
        <div class="restart-control">
          <button id="restartButton" type="button">Restart</button>
          <div class="restart-hint">Press * to restart</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const phrases = [
      "Regular practice turns every hesitant keystroke into a precise movement.",
      "A good developer reads the problem before writing the first line of code.",
      "The keyboard feels more natural when your eyes stay focused on the text.",
      "Every minute of training improves speed, accuracy, and confidence.",
      "Efficient shortcuts begin with stable posture and calm breathing.",
      "Typing fast is useless if errors slow down every correction afterward.",
      "A local assistant should remain simple, reliable, and controlled by its user.",
      "The best score matters only when it encourages cleaner typing.",
      "Strong habits are built through short and frequent practice sessions.",
      "A cleanly copied sentence is better than a rushed unfinished one."
    ];

    const alphabet = "abcdefghijklmnopqrstuvwxyz".split("");
    const targetText = document.getElementById("targetText");
    const typingInput = document.getElementById("typingInput");
    const restartButton = document.getElementById("restartButton");
    const letterSelect = document.getElementById("letterSelect");
    const targetWpmSelect = document.getElementById("targetWpmSelect");
    const changeLetterButton = document.getElementById("changeLetterButton");
    const nextLetterButton = document.getElementById("nextLetterButton");
    const exitCustomButton = document.getElementById("exitCustomButton");
    const wpmEl = document.getElementById("wpm");
    const accuracyEl = document.getElementById("accuracy");
    const timerEl = document.getElementById("timer");
    const progressEl = document.getElementById("progress");
    const letterStatEl = document.getElementById("letterStat");
    const lastScoreEl = document.getElementById("lastScore");
    const statusEl = document.getElementById("status");

    let currentPhrase = "";
    let startedAt = null;
    let finished = false;
    let timerId = null;
    let mode = "phrase";
    let activeLetter = "a";
    let dictionaries = [];
    let dictionariesReady = false;
    let loadingDictionaries = false;
    let paceCursor = null;
    let paceAnimationId = null;
    let finalStats = null;

    function updateLastScore(wpm) {
      lastScoreEl.textContent = `${wpm} WPM`;
    }

    function pickPhrase() {
      return phrases[Math.floor(Math.random() * phrases.length)];
    }

    function normalizeWord(word) {
      return word.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function chooseWordsForLetter(letter, count = 14) {
      const normalizedLetter = normalizeWord(letter);
      const matches = dictionaries.filter((word) => normalizeWord(word).includes(normalizedLetter));
      return shuffle(matches).slice(0, count);
    }

    function generateCustomSeries() {
      const words = chooseWordsForLetter(activeLetter);
      currentPhrase = words.length > 0 ? words.join(" ") : `No words available for letter ${activeLetter}`;
      resetAttempt(false);
      statusEl.textContent = `Custom Mode. Current letter: ${activeLetter.toUpperCase()}.`;
    }

    async function loadDictionaries() {
      if (dictionariesReady || loadingDictionaries) {
        return;
      }

      loadingDictionaries = true;
      statusEl.textContent = "Loading French and English dictionaries...";
      try {
        const [frenchResponse, englishResponse] = await Promise.all([
          fetch("data/french_words.json"),
          fetch("data/english_words.json")
        ]);

        if (!frenchResponse.ok || !englishResponse.ok) {
          throw new Error("Dictionary files not found. Serve the site locally or through GitHub Pages.");
        }

        const [frenchWords, englishWords] = await Promise.all([
          frenchResponse.json(),
          englishResponse.json()
        ]);

        dictionaries = [...new Set([...frenchWords, ...englishWords])].filter((word) => (
          typeof word === "string" && word.length >= 3 && word.length <= 18
        ));
        dictionariesReady = dictionaries.length > 0;
      } catch (error) {
        statusEl.textContent = `${error.message} Example: python3 -m http.server 8000 -d projects/typing-trainer`;
        throw error;
      } finally {
        loadingDictionaries = false;
      }
    }

    function ensurePaceCursor() {
      if (paceCursor && paceCursor.parentElement === targetText) {
        return;
      }
      paceCursor = document.createElement("div");
      paceCursor.className = "pace-cursor";
      targetText.appendChild(paceCursor);
    }

    function renderTarget(input = "") {
      ensurePaceCursor();
      targetText.querySelectorAll(".char").forEach((node) => node.remove());
      const fragment = document.createDocumentFragment();

      [...currentPhrase].forEach((character, index) => {
        const span = document.createElement("span");
        span.className = "char";
        span.textContent = character;

        if (index < input.length) {
          span.classList.add(input[index] === character ? "correct" : "incorrect");
        } else if (index === input.length && !finished) {
          span.classList.add("current");
        }

        fragment.appendChild(span);
      });

      targetText.insertBefore(fragment, paceCursor);
      updatePaceCursor();
    }

    function calculateStats(input, endedAt = Date.now()) {
      const elapsedMs = startedAt ? Math.max(endedAt - startedAt, 1) : 0;
      const elapsedMinutes = Math.max(elapsedMs / 60000, 1 / 60000);
      const typedChars = input.length;
      const correctChars = [...input].filter((character, index) => character === currentPhrase[index]).length;
      const words = correctChars / 5;
      const wpm = startedAt ? Math.round(words / elapsedMinutes) : 0;
      const accuracy = typedChars === 0 ? 100 : Math.round((correctChars / typedChars) * 100);
      const progress = currentPhrase.length === 0 ? 0 : Math.min(100, Math.round((typedChars / currentPhrase.length) * 100));
      const elapsedSecondsValue = startedAt ? Math.floor(elapsedMs / 1000) : 0;

      return { wpm, accuracy, progress, typedChars, elapsedSeconds: elapsedSecondsValue };
    }

    function getCharacterAnchor(index) {
      const chars = targetText.querySelectorAll(".char");
      if (chars.length === 0) {
        return null;
      }
      const clampedIndex = Math.min(Math.max(index, 0), chars.length - 1);
      return chars[clampedIndex];
    }

    function updatePaceCursor() {
      ensurePaceCursor();
      const targetWpm = Number.parseInt(targetWpmSelect.value, 10);
      const elapsedMinutes = startedAt ? (Date.now() - startedAt) / 60000 : 0;
      const expectedChars = elapsedMinutes * targetWpm * 5;
      const targetIndex = Math.min(Math.floor(expectedChars), Math.max(currentPhrase.length - 1, 0));
      const anchor = getCharacterAnchor(targetIndex);
      if (!anchor) {
        paceCursor.style.transform = "translate(0, 0)";
        return;
      }

      const targetRect = targetText.getBoundingClientRect();
      const anchorRect = anchor.getBoundingClientRect();
      const style = window.getComputedStyle(anchor);
      const lineHeight = Number.parseFloat(style.lineHeight) || anchorRect.height;
      const x = anchorRect.left - targetRect.left;
      const y = anchorRect.top - targetRect.top;
      paceCursor.style.height = `${Math.max(anchorRect.height, lineHeight)}px`;
      paceCursor.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    }

    function animatePaceCursor() {
      updatePaceCursor();
      if (startedAt && !finished) {
        paceAnimationId = window.requestAnimationFrame(animatePaceCursor);
      }
    }

    function startPaceAnimation() {
      if (paceAnimationId !== null) {
        return;
      }
      paceAnimationId = window.requestAnimationFrame(animatePaceCursor);
    }

    function stopPaceAnimation(resetPosition = false) {
      if (paceAnimationId !== null) {
        window.cancelAnimationFrame(paceAnimationId);
        paceAnimationId = null;
      }
      if (resetPosition) {
        updatePaceCursor();
      }
    }

    function displayStats(stats) {
      wpmEl.textContent = String(stats.wpm);
      accuracyEl.textContent = `${stats.accuracy}%`;
      progressEl.textContent = `${stats.progress}%`;
      timerEl.textContent = `${stats.elapsedSeconds}s`;
      letterStatEl.textContent = mode === "custom" ? activeLetter.toUpperCase() : "-";
    }

    function updateStats() {
      if (finalStats) {
        displayStats(finalStats);
        return;
      }
      const stats = calculateStats(typingInput.value);
      displayStats(stats);
      updatePaceCursor();
    }

    function stopTimer() {
      if (timerId) {
        window.clearInterval(timerId);
        timerId = null;
      }
      stopPaceAnimation(false);
    }

    function startTimer() {
      if (startedAt) {
        return;
      }
      startedAt = Date.now();
      timerId = window.setInterval(updateStats, 100);
      startPaceAnimation();
    }

    function completeSequence() {
      const endedAt = Date.now();
      finalStats = calculateStats(typingInput.value, endedAt);
      finalStats.progress = 100;
      finished = true;
      stopTimer();
      typingInput.disabled = true;
      renderTarget(typingInput.value);
      displayStats(finalStats);
      updateLastScore(finalStats.wpm);
      return finalStats;
    }

    function completePhraseMode() {
      const stats = completeSequence();
      statusEl.innerHTML = `<span class="complete">Complete. Score: ${stats.wpm} WPM.</span>`;
    }

    function completeCustomSeries() {
      const stats = completeSequence();
      statusEl.innerHTML = `<span class="complete">Series complete. Score: ${stats.wpm} WPM. New series generated.</span>`;
      window.setTimeout(generateCustomSeries, 450);
    }

    function finishIfComplete() {
      if (typingInput.value !== currentPhrase || finished) {
        return;
      }

      if (mode === "custom") {
        completeCustomSeries();
      } else {
        completePhraseMode();
      }
    }

    function handleTyping() {
      if (finished) {
        return;
      }

      if (typingInput.value.length > 0) {
        startTimer();
      }

      renderTarget(typingInput.value);
      updateStats();
      finishIfComplete();
    }

    function resetAttempt(chooseNewPhrase = true) {
      stopTimer();
      if (chooseNewPhrase) {
        currentPhrase = pickPhrase();
      }
      startedAt = null;
      stopPaceAnimation(false);
      finalStats = null;
      finished = false;
      typingInput.disabled = false;
      typingInput.value = "";
      renderTarget();
      updateStats();
      typingInput.focus();
    }

    function restart() {
      if (mode === "custom") {
        generateCustomSeries();
        return;
      }

      currentPhrase = pickPhrase();
      statusEl.textContent = "Ready. Copy the text shown above.";
      resetAttempt(false);
    }

    async function enterCustomMode(letter) {
      activeLetter = letter;
      letterSelect.value = activeLetter;
      await loadDictionaries();
      mode = "custom";
      generateCustomSeries();
    }

    async function changeLetter() {
      try {
        await enterCustomMode(letterSelect.value);
      } catch (_error) {
        mode = "phrase";
        updateStats();
      }
    }

    async function nextLetter() {
      const currentIndex = alphabet.indexOf(activeLetter);
      const nextIndex = currentIndex === -1 ? 0 : (currentIndex + 1) % alphabet.length;
      letterSelect.value = alphabet[nextIndex];
      await changeLetter();
    }

    function exitCustomMode() {
      mode = "phrase";
      activeLetter = letterSelect.value || "a";
      currentPhrase = pickPhrase();
      statusEl.textContent = "Random phrase mode. Copy the text shown above.";
      resetAttempt(false);
    }

    alphabet.forEach((letter) => {
      const option = document.createElement("option");
      option.value = letter;
      option.textContent = letter.toUpperCase();
      letterSelect.appendChild(option);
    });
    letterSelect.value = activeLetter;

    typingInput.addEventListener("input", handleTyping);
    typingInput.addEventListener("keydown", (event) => {
      if (event.key === "*") {
        event.preventDefault();
        restart();
      }
    });
    restartButton.addEventListener("click", restart);
    changeLetterButton.addEventListener("click", changeLetter);
    nextLetterButton.addEventListener("click", nextLetter);
    exitCustomButton.addEventListener("click", exitCustomMode);
    targetWpmSelect.addEventListener("change", () => {
      startedAt = null;
      stopTimer();
      typingInput.value = "";
      renderTarget();
      updateStats();
      typingInput.focus();
    });
    window.addEventListener("resize", updatePaceCursor);

    updateLastScore(0);
    restart();
  </script>
</body>
</html>
